[pytest]
testpaths = tests
# 固化「并行 + 判据 + 慢项Top」三件事，避免每次手打、避免忘打 -n（忘一次即 499s 串行）：
#   -n 4               pytest-xdist 并行。**不用 `auto`** —— 见下
#   --junitxml         判据落盘（§9.3：只看 xml 四数，退出码会假性变 1）
#   --durations=15     打印最慢 15 个用例，提速回归时靠它定位
# 想串行调试用 `-n0` 覆盖；`-p no:cacheprovider` 等按需追加。
#
# ⚠️ **为什么是 4 而不是 auto（2026-10-26 实测）**：
#   本机 8 核 ⇒ `auto` 起 8 个 worker。而 `core/database.py` 的连接池是
#   `pool_size=10 + max_overflow=20` = **每 worker 最多 30 条连接**
#   ⇒ 8×30 = 240，而本机 PG `max_connections = 100`。
#   实测后果：全量回归跑到一半报 `too many clients already`，
#   随后 pytest 在 `pytest_sessionfinish` 里抛 `OSError: cannot send (already closed?)`，
#   **xml 根本不落盘**，退出码变成 127 —— 看起来像「测试大面积失败」，
#   其实是连接池打爆。逐个文件串行跑（`-n0`）100% 通过可以佐证。
#   4 个 worker 的上限是 4×30=120，仍可能超；但实测 4 并发稳定（多数 worker
#   只开 1~2 条连接）。真要更稳用 `-n 2`，代价是全量时长约翻倍。
addopts = -n 4 -q --junitxml=.hermes/reports/reg.xml --durations=15

# 慢用例标记（P1-3，2026-09-25）：迁移往返 / 扫码登录 / 批量生成等 >3s 的用例。
# 内循环用 `-m "not slow"` 跳过它们换取秒级反馈；中循环与全量仍全跑。
markers =
    slow: 慢用例（>3s：迁移往返 / 扫码登录 / 批量生成等），内循环可 -m "not slow" 跳过
    redline: 红线守卫（挂了代表数据会被写坏 / 凭据泄漏 / 平台被封），内循环必跑
    contract: 契约守卫（端点 / 字段 / 行为与文档一致），中循环跑
    integration: 集成守卫（真跑迁移 / 建表核对 / 种子播种），收尾跑，慢且重
    allow_network: 允许真实外连（默认全禁；用了必须在此写清为什么要连外网）
