[alembic]
script_location = backend/alembic
# IMPORTANT: must point at the DB the app actually uses
# (backend/app/core/database.py -> sqlite:///./data/spider_xhs.db).
#
# 2026-10-17 pitfall: this used to be backend/app/storage/spider_xhs.db (a 1MB
# empty shell). A manual `alembic upgrade head` reported SUCCESS but migrated the
# shell, leaving alembic_version at the new head while the real DB was untouched
# -- a silent failure. Tests always override via DATABASE_URL, so they never saw it.
# ASCII only: this file is read with the platform default codec (GBK on this host);
# non-ASCII comments raise UnicodeDecodeError and break app startup.
sqlalchemy.url = sqlite:///./data/spider_xhs.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
