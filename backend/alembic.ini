[alembic]
script_location = backend/alembic
# IMPORTANT: must point at the DB the app actually uses
# (backend/app/core/database.py -> PostgreSQL, since v1.1.0).
#
# 2026-10-17 pitfall: this used to be backend/app/storage/spider_xhs.db (a 1MB
# empty shell). A manual `alembic upgrade head` reported SUCCESS but migrated the
# shell, leaving alembic_version at the new head while the real DB was untouched
# -- a silent failure. Tests always override via DATABASE_URL, so they never saw it.
# ASCII only: this file is read with the platform default codec (GBK on this host);
# non-ASCII comments raise UnicodeDecodeError and break app startup.
# v1.1.0 (2026-10-24): SQLite retired, PostgreSQL only.
# The app always overrides this at runtime via database._run_alembic_migrations
# (it sets sqlalchemy.url from settings). This value only matters for a manual
# CLI run; keep it pointed at the real PG database, never at a file.
sqlalchemy.url = postgresql+psycopg://postgres:123456@127.0.0.1:5432/spider_xhs

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
