[alembic]
# PostgreSQL migration chain -- the MAIN line (design 51 §2.2: PG main, SQLite
# derived). It does NOT replay the 95 historical SQLite migrations (37 of them
# run `PRAGMA table_info`, which is a syntax error on PG). Instead it starts
# from a full baseline (pg_baseline_0001) and every new feature appends to it.
#
# The two chains never reference each other and each has its own
# alembic_version row. Their agreement is enforced by
# tests/backend/test_two_chains_in_sync.py: autogenerate against BOTH must be
# an empty migration.
#
# script_location is relative to this file's directory (resolved here, not
# from CWD): the server / installed build never runs from the repo root.
#
# ASCII ONLY: this file is read with the platform default codec (GBK on
# Windows). A single non-ASCII character raises UnicodeDecodeError and breaks
# startup with no mention of alembic in the traceback.
script_location = backend/alembic_pg
prepend_sys_path = ..
sqlalchemy.url = postgresql+psycopg://postgres:123456@127.0.0.1:5432/spider_xhs

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
