# Nginx 反代配置（v1.1.0 / 设计 52 §3）
#
# ## 为什么需要它（不能让 uvicorn 直接对外）
#
# 1. **静态资源不该走 Python**：前端产物由 nginx 直出（`try_files`），
#    只有 `/api` 才转给 uvicorn。否则每个 js/css 都要过一遍 ASGI，白白吃掉
#    一个 Python 工作进程；
# 2. **超时**：数据包预检、商品同步、图片生成这些请求要几十秒到几分钟，
#    uvicorn 默认没有网关层的超时保护，nginx 必须有；
# 3. **上传体积**：数据包（xlsx + 上百张图）默认 `client_max_body_size` 是 1M，
#    不改就会 413 —— 这是本项目部署后「上传失败」的最常见原因。

server {
    listen 80;
    server_name _;

    #: 上传体积上限（数据包常见 100+ 图片）。按用户实际形态给到 512M；
    #: 再大更适合走对象存储，而不是继续抬这个值。
    client_max_body_size 512m;
    #: 大文件上传时不要先缓冲到磁盘再转发（省一次落盘，也省磁盘空间）
    client_body_buffer_size 1m;
    client_body_timeout 300s;

    #: gzip 只压文本类；图片/视频已经压过，再压是浪费 CPU
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1k;

    #: ── 前端产物（SPA）──────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        #: ⚠️ SPA 回退：`/system/roles` 这类前端路由在磁盘上没有对应文件，
        #: 不回退到 index.html 就会 404（用户刷新页面就白屏）。
        try_files $uri $uri/ /index.html;
    }

    #: 带 hash 的产物可以长缓存；`index.html` 绝不能缓存
    #: （否则发版后浏览器一直拿旧的 index.html 引用已删除的 js ⇒ 白屏）。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    #: ── API 反代 ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        #: 透传真实客户端信息（后端记 `last_login_ip` / 审计日志要用）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        #: 流式响应（导出 CSV / 下载安装包）不要缓冲，否则大文件会先在
        #: nginx 侧攒满再吐，表现为「点了下载要等很久才开始」。
        proxy_buffering off;

        #: 长耗时接口：数据包预检（OCR 上百张图）、商品同步、图片生成。
        #: 实测最慢的预检约 160 秒（v1.0.6 优化后 30 秒），给 600 秒余量。
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    #: ── 运行依赖的静态下载（OCR 模型 / ffmpeg / node 内核）────────────
    #: 这些是「可下载三方依赖」（packaging/README.md 的规则），由后端按需下载
    #: 到 data/deps 并对外提供；nginx 直接映射可以省掉一层 Python。
    location /deps/ {
        alias /app/data/deps/;
        autoindex off;
        expires 7d;
    }
}
