# Spider_XHS Configuration
# ========================
# This is the default configuration file.
# Values here can be overridden by:
#   1. A custom YAML file specified via CONFIG_FILE env var
#   2. Environment variables (highest priority)
#
# Environment variable mapping:
#   server.host          -> SERVER_HOST
#   server.port          -> SERVER_PORT
#   server.cors_origins  -> BACKEND_CORS_ORIGINS
#   database.type        -> DATABASE_TYPE
#   database.sqlite_path -> DATABASE_SQLITE_PATH
#   database.mysql_host  -> DATABASE_MYSQL_HOST
#   database.mysql_port  -> DATABASE_MYSQL_PORT
#   database.mysql_user  -> DATABASE_MYSQL_USER
#   database.mysql_password -> DATABASE_MYSQL_PASSWORD
#   database.mysql_database -> DATABASE_MYSQL_DATABASE
#   security.secret_key  -> SECRET_KEY
#   security.fernet_key  -> FERNET_KEY
#   scheduler.enabled    -> SCHEDULER_ENABLED
#   scheduler.interval_seconds -> SCHEDULER_INTERVAL_SECONDS
#   qianfan.health_check_enabled -> QIANFAN_HEALTH_CHECK_ENABLED
#   qianfan.health_check_interval_hours -> QIANFAN_HEALTH_CHECK_INTERVAL_HOURS
#   frontend.serve_static -> FRONTEND_SERVE_STATIC
#   frontend.build_dir   -> FRONTEND_BUILD_DIR

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"

database:
  # PostgreSQL —— **唯一**支持的数据库（v1.1.0 / 2026-10-24）
  # 用户口径：「完全放弃 SQLite，全部迁移到 PG」「部署远程不在考虑 sqlite 数据库」
  # ⚠️ 原来这里有 type / sqlite_path / mysql_* 三组配置，已全部删除：
  #    type 只剩一个取值等于没有开关；sqlite_path 随 SQLite 退役失效；
  #    mysql_* 从未真正支持过（只在 model_post_init 里拼过串）。
  # 驱动 psycopg3；也可用环境变量覆盖（优先级更高）：
  #   DATABASE_POSTGRES_HOST / _PORT / _USER / _PASSWORD / _DATABASE
  #   或直接给整条 DATABASE_URL
  postgres_host: "127.0.0.1"
  postgres_port: 5432
  postgres_user: "postgres"
  postgres_password: "123456"
  postgres_database: "spider_xhs"

feature:
  # 开放注册（v1.1.0 / 设计 46 §388 + 设计 50 §261）。
  # **默认 false**：出厂管理员是 `admin/admin123` + 首次登录强制改密，若同时开放注册，
  # 「弱口令 + 任何人可注册」两条就同时成立。
  # 三处同值（本文件 = 随包种子 `config/initial_data/system_settings.json` =
  # `services/settings_service.BUILTIN_DEFAULTS`），改一处要三处一起改。
  register:
    enabled: false

security:
  # JWT 签名密钥 —— 生产/服务器形态必须改（启动自检会拒绝以默认值启动）。
  # 2026-10-23 切 PG 主库时生成（secrets.token_urlsafe(48)，64 字符）。
  # ⚠️ 该值泄露 = 任何人可伪造任意用户令牌 ⇒ 不要提交到公开仓库。
  secret_key: "IGy3soGGmfdQQHnmlUITxF_RawDA5d9U1vFRjP1gtyw4A5HDmwnE0eN5N9YP-YZu"
  # Fernet key for encrypting cookies and API keys
  # If empty, auto-derived from secret_key via SHA-256 + base64
  fernet_key: ""

scheduler:
  # Enable background task scheduler (publish jobs, monitoring refresh)
  # 2026-09-24 用户口径：**默认启用**（装完即按任务行的 cron 自动执行；设计 15 §4.5）。
  # ⚠️ 本开关只管「调度器起不起来」，**每个任务跑不跑看 `scheduled_jobs.status`**
  #    （任务中心可逐条暂停/恢复）—— 两件事，别混。
  enabled: true
  # Polling interval in seconds
  interval_seconds: 60

# 千帆（ark）店铺绑定的登录态巡检（T-31）：只读探活 `GET /api/edith/seller/info/v2`
# enabled=false 时**不注册定时任务**（页面的「立即巡检」按钮仍可用）
qianfan:
  health_check_enabled: true
  # 巡检周期（小时），默认 6；只有到期（health_checked_at 超过周期）的绑定才会被探活
  health_check_interval_hours: 6

# 账号矩阵同步（设计 13 §19 / §21）：节流与账号间停顿
xhs:
  sync:
    # 平台请求限流（次/分钟，按 `<账号>:<源>` 键计量；`wait_allow` 等待式，不即停）。
    # 默认 **8**（2026-09-27 由 60 下调，用户口径，见设计 13 §38.7）—— 实测 60 次/分钟
    # 会让平台踢掉网页会话（随后同步全线登录失效），保守区间 5~10。
    # ⚠️ 这只是**第 3 层兜底**（构造参数 > 运行时配置 > 本键 > 内置 5）；正常安装路径下
    #    读的是随包种子铺设的 `system_settings` 行（设置页可改、改完立即生效）。
    rate_limit_per_minute: 8
    # 调度轮内账号之间的停顿（秒）：多账号矩阵不一窝蜂
    account_gap_seconds: 10
    # 同步并行账号数（设计 13 §38.3）：同一账号始终串行，并行只发生在账号之间。
    # 范围 1–8。⚠️ 与限流额度是乘性关系：N 个账号并行 ⇒ 出口 IP 总请求速率 ×N。
    account_parallelism: 3
    # 媒体上传并发数（设计 24 §22，2026-10-11 用户口径：方案 B，并发数默认 5，可在 config 表配置）。
    # 上传两段式：申请凭证打小红书（**整批只 1 次**），PUT 字节打对象存储（不是小红书域名）
    # ⇒ 并发不产生平台请求，风控风险与串行相同。真机：38 张详情图串行 94s → 并发 5 约 19s。
    # ⚠️ 这只是**第 3 层兜底**：正常安装路径读的是随包种子铺设的 `system_settings` 行。
    image_upload_parallelism: 8
  # 商品笔记发布（设计 13 §31.5.2，2026-09-28 用户口径）：是否**允许同一商品重复发布**
  # 笔记。默认 **false** = 同一商品已有笔记（已发布 / 正在发布）时，再点发布 / 批量发布
  # 会**不再发布**，该笔记直接落「发布失败」+ 原因「挂载的商品已经发布过笔记」（零平台请求）。
  # ⚠️ 这只是**第 3 层兜底**：正常安装路径下读的是随包种子铺设的 `system_settings` 行
  #    （设置页可改、改完**立即生效**，无需重启）。
  publish:
    allow_duplicate_goods: false
    # SKU 规格名称字数上限（用户口径：30 字 = 60 字符，汉字计 2、ASCII 计 1）。
    # ⚠️ 第 3 层兜底：正常安装路径读随包种子铺设的 `system_settings` 行。
    sku_name_max_chars: 60

frontend:
  # Set to true to serve pre-built frontend from backend (Docker/production)
  serve_static: false
  # Path to the built frontend assets.
  # ⚠️ 留空 = 由 `backend/app/core/paths.frontend_dist()` 兜底（按**文件位置**推目录，
  #    与 CWD 无关 —— 设计 53 的 A2）。写相对路径时**按仓库根解析**，不再按 CWD：
  #    systemd / Docker / 换目录起 uvicorn 的 CWD 各不相同，相对 CWD 会让整个前端 404。
  build_dir: ""

# 系统更新（设计 36，2026-10-13 用户口径「更新地址为当前项目的远程仓库」）。
# ⚠️ **两项都留空时更新检查静默跳过**（不打扰用户）：仓库私有时不放令牌进包（= 泄露）。
#   维护者/安装者可按需填 `manifest_url`（推荐的零鉴权静态清单）。
#   也可用环境变量覆盖：UPDATE_MANIFEST_URL / UPDATE_GITHUB_OWNER / UPDATE_GITHUB_REPO。
update:
  # 静态清单 URL（如 https://example.com/xhs/update.json），非空则**优先**走它。
  manifest_url: ""
  # GitHub Release 路径（2026-10-20 用户口径「换成 GitHub Release，Gitee 不要了」）。
  # 起因：Gitee Release 单个附件硬上限 100 MB，安装包 1.0.4 已达 113.6 MB ⇒ 传不上去。
  # 查询顺序：manifest_url → github（前者为空/失败才降级）。
  github_owner: "Sir-yuChen"
  github_repo: "xhs"
  # 私有仓库需私人令牌；仓库公开后留空即可。
  github_token: ""
  # 仓库是否公开（已公开 ⇒ 匿名即可查 Release）。
  github_public: true
